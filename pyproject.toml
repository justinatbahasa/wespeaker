[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wespeaker"
version = "0.0.0"
description = "End to end speech speaker toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache Software License" }

dependencies = [
    "tqdm",
    "kaldiio",
    "hdbscan",
    "umap-learn==0.5.6",
    "torch>=1.12.0",
    "torchaudio>=0.12.0",
    "silero-vad",
]